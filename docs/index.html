<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a2b">
  <title>Astra Craft Docs</title>
  <meta name="description" content="Astra Craft 제품의 사용자 가이드와 정책 문서">
  <link rel="canonical" href="https://doc.astracraft.kr/">
  <style>
    :root { color-scheme: light; --ink:#181a25; --muted:#646778; --paper:#fbfaf8; --line:#dedce5; --violet:#4b45aa; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:Inter,Pretendard,"Noto Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
    header, main, footer { width:min(1040px,calc(100% - 40px)); margin-inline:auto; }
    header { min-height:72px; display:flex; align-items:center; border-bottom:1px solid var(--line); font-weight:800; letter-spacing:-.02em; }
    main { min-height:calc(100vh - 160px); padding:88px 0; }
    .eyebrow { margin:0 0 12px; color:var(--violet); font-size:.76rem; font-weight:800; letter-spacing:.14em; }
    h1 { max-width:720px; margin:0; font-size:clamp(2.8rem,7vw,5.5rem); line-height:1; letter-spacing:-.065em; }
    .lead { max-width:620px; margin:24px 0 54px; color:var(--muted); font-size:1.12rem; line-height:1.7; }
    .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .product { min-height:230px; display:flex; flex-direction:column; justify-content:space-between; padding:28px; border:1px solid var(--line); border-radius:24px; color:var(--ink); background:white; text-decoration:none; box-shadow:0 16px 45px rgba(36,32,70,.08); transition:transform .18s,border-color .18s; }
    .product:hover { transform:translateY(-3px); border-color:var(--violet); }
    .mark { width:44px; height:44px; display:grid; place-items:center; border-radius:14px; color:white; background:var(--violet); font-size:1.3rem; }
    .product h2 { margin:34px 0 6px; font-size:1.65rem; letter-spacing:-.04em; }
    .product p { margin:0; color:var(--muted); line-height:1.55; }
    .open { margin-top:28px; color:var(--violet); font-weight:800; }
    footer { padding:24px 0 36px; border-top:1px solid var(--line); color:var(--muted); font-size:.84rem; }
  </style>
</head>
<body>
  <header>Astra Craft Docs</header>
  <main>
    <p class="eyebrow">PRODUCT DOCUMENTATION</p>
    <h1>제품을 선택하세요.</h1>
    <p class="lead">Astra Craft 제품의 사용자 가이드, 정책, 라이선스와 지원 정보를 한곳에서 확인할 수 있습니다.</p>
    <section class="products" aria-label="제품 목록">
      <a class="product" href="/ScoreCue/">
        <span class="mark" aria-hidden="true">♪</span>
        <div><h2>ScoreCue</h2><p>연주자를 위한 PDF 악보 뷰어와 합주 도구</p><div class="open">문서 열기 →</div></div>
      </a>
    </section>
  </main>
  <footer>© 2026 Astra Craft · <a href="mailto:support@astracraft.kr">support@astracraft.kr</a></footer>
</body>
</html>
